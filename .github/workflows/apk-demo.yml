name: APK da demonstração

# Compila a vitrine HTML como um app Android instalável. O APK sai como
# artefato da execução — não precisa de Android Studio na máquina de ninguém.
on:
  workflow_dispatch:
  push:
    paths:
      - 'demo/**'
      - '.github/workflows/apk-demo.yml'

permissions:
  contents: read

jobs:
  apk:
    name: Compilar APK de demonstração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar
        working-directory: demo/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Conferir o APK
        run: ls -lh demo/android/app/build/outputs/apk/debug/

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: farroups-pay-demo-apk
          path: demo/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
